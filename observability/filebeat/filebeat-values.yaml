filebeatConfig:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          hints.enabled: true
          templates:
            - condition:
                contains:
                  kubernetes.labels.app.kubernetes.io/part-of: vaultbank
              config:
                - type: container
                  paths:
                    - /var/log/containers/*-${data.kubernetes.container.id}.log
                  processors:
                    - add_kubernetes_metadata: {}
                    - decode_json_fields:
                        fields: ["message"]
                        target: "json"
                        overwrite_keys: true
    output.elasticsearch:
      hosts: ["http://elasticsearch-master:9200"]
    logging.level: info
