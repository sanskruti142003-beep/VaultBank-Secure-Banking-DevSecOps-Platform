# Production Vault overlay.
# Use this with a real TLS directory and KMS-backed auto-unseal configuration.
# Example:
# docker compose -f docker-compose.yml -f docker-compose.vault-production.yml up -d vault

services:
  vault:
    command: ['server', '-config=/vault/config/vault.production.hcl']
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_API_ADDR: ${VAULT_API_ADDR:?Set VAULT_API_ADDR for production}
      AWS_REGION: ${AWS_REGION:?Set AWS_REGION for Vault KMS auto-unseal}
    ports: []
    volumes:
      - ./docker/vault/config/vault.production.hcl:/vault/config/vault.production.hcl:ro
      - ${VAULT_TLS_DIR:?Set VAULT_TLS_DIR to a directory containing tls.crt, tls.key, and ca.crt}:/vault/tls:ro
      - banking_vault_data:/vault/data

  vault-init:
    profiles:
      - local-dev-only

volumes:
  banking_vault_data:
