server {
    listen 8443 ssl default_server;
    http2 on;
    # The default server accepts localhost plus any NGINX_HOST used to reach
    # this gateway. Restrict this list to explicit production domains there.
    server_name localhost _;

    # ssl.conf, gzip.conf, and security-headers.conf are loaded at the http
    # context by nginx.conf. Re-include security headers at this level so they
    # remain present when a location defines CORS response headers.
    include /etc/nginx/conf.d/security-headers.conf;

    proxy_intercept_errors on;

    error_page 400 /errors/400.json;
    error_page 401 /errors/401.json;
    error_page 403 /errors/403.json;
    error_page 404 /errors/404.json;
    error_page 429 = @rate_limit_error;
    error_page 500 502 503 504 /errors/5xx.json;

    location = /internal {
        include /etc/nginx/snippets/internal-block.conf;
    }

    location ^~ /internal/ {
        include /etc/nginx/snippets/internal-block.conf;
    }

    location = /health {
        limit_req zone=health_limit burst=10;
        default_type application/json;
        include /etc/nginx/conf.d/security-headers.conf;
        return 200 '{"status":"ok","service":"nginx-gateway"}';
    }

    location = /health/auth {
        limit_req zone=health_limit burst=10;
        proxy_pass http://auth_service/v1/health;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /health/accounts {
        limit_req zone=health_limit burst=10;
        proxy_pass http://account_service/v1/health;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /health/transactions {
        limit_req zone=health_limit burst=10;
        proxy_pass http://transaction_service/v1/health;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /health/payments {
        limit_req zone=health_limit burst=10;
        proxy_pass http://payment_service/v1/health;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /health/notifications {
        limit_req zone=health_limit burst=10;
        proxy_pass http://notification_service/v1/health;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /metrics/auth {
        proxy_pass http://auth_service/v1/metrics;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /metrics/accounts {
        proxy_pass http://account_service/v1/metrics;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /metrics/transactions {
        proxy_pass http://transaction_service/v1/metrics;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /metrics/payments {
        proxy_pass http://payment_service/v1/metrics;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location = /metrics/notifications {
        proxy_pass http://notification_service/v1/metrics;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Webhooks deliberately have no limit_req directive. Request and response
    # buffering are disabled to preserve gateway signature payload handling.
    location = /api/payments/webhooks/stripe {
        proxy_pass http://payment_service/v1/payments/webhooks/stripe;
        include /etc/nginx/snippets/proxy-webhook-params.conf;
        include /etc/nginx/snippets/cors.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        client_body_buffer_size 1m;
    }

    location = /api/payments/webhooks/paypal {
        proxy_pass http://payment_service/v1/payments/webhooks/paypal;
        include /etc/nginx/snippets/proxy-webhook-params.conf;
        include /etc/nginx/snippets/cors.conf;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /api/auth/login {
        proxy_intercept_errors off;
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://auth_service/v1/auth/login;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location = /api/auth/register {
        proxy_intercept_errors off;
        limit_req zone=auth_limit burst=2 nodelay;
        proxy_pass http://auth_service/v1/auth/register;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location = /api/auth/forgot-password {
        proxy_intercept_errors off;
        limit_req zone=auth_limit burst=2 nodelay;
        proxy_pass http://auth_service/v1/auth/forgot-password;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location = /api/auth {
        proxy_intercept_errors off;
        limit_req zone=api_limit burst=20 nodelay;
        limit_req zone=user_api_limit burst=20 nodelay;
        proxy_pass http://auth_service/v1/auth;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location ^~ /api/auth/ {
        proxy_intercept_errors off;
        limit_req zone=api_limit burst=20 nodelay;
        limit_req zone=user_api_limit burst=20 nodelay;
        rewrite ^/api/auth/(.*)$ /v1/auth/$1 break;
        proxy_pass http://auth_service;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location = /api/accounts {
        proxy_intercept_errors off;
        limit_req zone=api_limit burst=20 nodelay;
        limit_req zone=user_api_limit burst=20 nodelay;
        proxy_pass http://account_service/v1/accounts;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location ^~ /api/accounts/ {
        proxy_intercept_errors off;
        limit_req zone=api_limit burst=20 nodelay;
        limit_req zone=user_api_limit burst=20 nodelay;
        rewrite ^/api/accounts/(.*)$ /v1/accounts/$1 break;
        proxy_pass http://account_service;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location = /api/transactions {
        proxy_intercept_errors off;
        limit_req zone=financial_limit burst=5 nodelay;
        limit_req zone=user_api_limit burst=20 nodelay;
        proxy_pass http://transaction_service/v1/transactions;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location ^~ /api/transactions/ {
        proxy_intercept_errors off;
        limit_req zone=financial_limit burst=5 nodelay;
        limit_req zone=user_api_limit burst=20 nodelay;
        rewrite ^/api/transactions/(.*)$ /v1/transactions/$1 break;
        proxy_pass http://transaction_service;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location = /api/payments {
        proxy_intercept_errors off;
        limit_req zone=financial_limit burst=5 nodelay;
        limit_req zone=user_api_limit burst=20 nodelay;
        proxy_pass http://payment_service/v1/payments;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location ^~ /api/payments/ {
        proxy_intercept_errors off;
        limit_req zone=financial_limit burst=5 nodelay;
        limit_req zone=user_api_limit burst=20 nodelay;
        rewrite ^/api/payments/(.*)$ /v1/payments/$1 break;
        proxy_pass http://payment_service;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/cors.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        include /etc/nginx/snippets/cors.conf;
        return 404;
    }

    location / {
        return 404;
    }

    location ^~ /errors/ {
        internal;
        root /etc/nginx/html;
        default_type application/json;
        include /etc/nginx/snippets/cors.conf;
    }

    location @rate_limit_error {
        default_type application/json;
        include /etc/nginx/snippets/cors.conf;
        return 429 '{"success":false,"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Please try again later."},"timestamp":"$time_iso8601"}';
    }
}
