# Add more server directives and enable least_conn when horizontally scaling.
# Example:
# upstream auth_service {
#     least_conn;
#     server auth-service-1:3001;
#     server auth-service-2:3001;
#     server auth-service-3:3001;
#     keepalive 32;
#     keepalive_requests 100;
#     keepalive_timeout 60s;
# }

map $http_origin $cors_origin {
    default "";
    ~^https?://localhost:5173$ $http_origin;
    ~^https?://127\.0\.0\.1:5173$ $http_origin;
    ~^https?://localhost:3000$ $http_origin;
    ~^https?://127\.0\.0\.1:3000$ $http_origin;
    ~^https?://yourdomain\.com$ $http_origin;
}

upstream auth_service {
    server auth-service:3001;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

upstream account_service {
    server account-service:3002;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

upstream transaction_service {
    server transaction-service:3003;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

upstream payment_service {
    server payment-service:3004;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}
