# Strict authentication throttling to slow brute-force attempts.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Standard public API throttling.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# Lower rate for money-moving endpoints.
limit_req_zone $binary_remote_addr zone=financial_limit:10m rate=20r/m;

# Health probes remain bounded but generous.
limit_req_zone $binary_remote_addr zone=health_limit:1m rate=30r/m;

# Vanilla Nginx cannot decode a JWT claim without an additional module.
# Authenticated callers are therefore keyed by bearer token; anonymous callers
# fall back to their binary IP address.
map $http_authorization $rate_key {
    default $binary_remote_addr;
    ~*^Bearer\s+(.+)$ $1;
}

limit_req_zone $rate_key zone=user_api_limit:10m rate=100r/m;
