server {
    listen 8080 default_server;
    server_name _;

    include /etc/nginx/conf.d/security-headers.conf;

    location = /health {
        default_type application/json;
        include /etc/nginx/conf.d/security-headers.conf;
        return 200 '{"status":"ok","service":"nginx-gateway"}';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
