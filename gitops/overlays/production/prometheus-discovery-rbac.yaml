apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-production-discovery
rules:
  - apiGroups:
      - ""
    resources:
      - services
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-production-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: vault-bank-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-production-discovery
