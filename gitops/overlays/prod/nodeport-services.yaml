apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31080
    - name: https
      port: 443
      targetPort: https
      nodePort: 31443
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31081
