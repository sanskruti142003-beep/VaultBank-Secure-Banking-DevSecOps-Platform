apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bank-zap-customer-seed
  labels:
    app.kubernetes.io/name: zap-customer-seed
    app.kubernetes.io/part-of: vaultbank
    app.kubernetes.io/component: dast-seed
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zap-customer-seed
        app.kubernetes.io/part-of: vaultbank
        app.kubernetes.io/component: dast-seed
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      serviceAccountName: vault-bank-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zap-customer-seed
          image: auth-service
          imagePullPolicy: Always
          command:
            - node
            - dist/apps/auth-service/apps/auth-service/src/database/seeds/seed-zap-customer.js
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          envFrom:
            - configMapRef:
                name: banking-runtime-config
            - secretRef:
                name: banking-runtime-secrets
            - secretRef:
                name: zap-staging-customer
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
