apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultbank-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/vault_bank.git
    targetRevision: main
    path: gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultbank-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
