apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultbank-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/vault_bank.git
    targetRevision: main
    path: gitops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultbank-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
